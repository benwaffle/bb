<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="form">
      <label for="serverUrl">bb server URL</label>
      <input id="serverUrl" type="url" placeholder="http://127.0.0.1:38886" />
      <p>
        The desktop app records it as <code>serverUrl</code> in
        <code>~/.bb/bb-app-runtime.json</code>.
      </p>

      <label for="apiToken">bb API token</label>
      <input id="apiToken" type="password" autocomplete="off" />
      <p>Copy it from the bb data directory:</p>
      <pre>cat ~/.bb/api-token</pre>

      <button class="primary" type="submit">Save and test</button>
      <div id="status" class="status"></div>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
